    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=El+Messiri:wght@500;600;700&family=Sora:wght@400;500;600&family=Tajawal:wght@300;400;500;700&family=Tangerine:wght@700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                primary: '#9A79BA',      // African Violet
                'primary-deep': '#653C87', // Deep Violet (hover / solid text bg)
                secondary: '#A8A2AB',    // Rose Quartz
                dark: '#241C2C',         // Deep Plum text
                bg: '#F9F8FA',           // Lavender Mist background
                surface: '#FFFFFF',      // Pure white cards
              }
            },
            fontFamily: {
              messiri: ['El Messiri', 'sans-serif'],
              tajawal: ['Tajawal', 'sans-serif'],
              cormorant: ['Cormorant Garamond', 'Georgia', 'serif'],
              tangerine: ['Tangerine', 'cursive'],
              ruqaa: ['Aref Ruqaa', 'serif'],
              sora: ['Sora', 'sans-serif'],
              sans: ['Tajawal', 'system-ui', 'sans-serif'],
              serif: ['Cormorant Garamond', 'Georgia', 'serif'],
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Tajawal', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #F9F8FA;
        color: #241C2C;
      }
      ::selection {
        background-color: rgba(154, 121, 186, 0.25);
        color: #241C2C;
      }

      /* ── Smooth scroll offset for fixed header ── */
      [id] {
        scroll-margin-top: 96px;
      }

      /* ════════════════ Keyframe animations ════════════════ */

      /* Soft breathing of the violet hero orb */
      @keyframes orbBreathe {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      .orb-breathe { animation: orbBreathe 8s ease-in-out infinite; }

      /* Slow drift of the fixed ambient page glows */
      @keyframes glowDrift {
        0%, 100% { transform: translate(0, 0); }
        33% { transform: translate(28px, -22px); }
        66% { transform: translate(-22px, 18px); }
      }
      .glow-drift { animation: glowDrift 18s ease-in-out infinite; }

      /* Faint tooth/anatomy outline parallax drift */
      @keyframes toothDrift {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(10px) rotate(2deg); }
      }
      .tooth-drift { animation: toothDrift 14s ease-in-out infinite; }

      /* Gentle heart pulse beside the signature */
      @keyframes heartPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.14); }
      }
      .heart-pulse { animation: heartPulse 2.4s ease-in-out infinite; }

      /* Soft floating motes */
      @keyframes moteFloat {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
        50% { transform: translate(14px, -22px) scale(1.1); opacity: 0.9; }
      }
      .mote-float { animation: moteFloat 16s ease-in-out infinite; }

      /* Scroll cue bob */
      @keyframes scrollBob {
        0%, 100% { transform: translateY(0); opacity: 0.7; }
        50% { transform: translateY(6px); opacity: 1; }
      }
      .scroll-bob { animation: scrollBob 2s ease-in-out infinite; }

      /* ── Respect reduced-motion: keep fades, drop ambient/looping motion ── */
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .orb-breathe,
        .glow-drift,
        .tooth-drift,
        .heart-pulse,
        .mote-float,
        .scroll-bob {
          animation: none !important;
        }
      }
    </style>
